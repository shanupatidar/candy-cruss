<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Match Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 2.5rem;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .stats {
      display: flex;
      gap: 30px;
      font-size: 1.2rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px 25px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 55px);
      grid-template-rows: repeat(8, 55px);
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .tile {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, background 0.2s ease;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.2);
    }

    .tile:hover {
      transform: scale(1.08);
    }

    .tile.selected {
      outline: 3px solid #ffeb3b;
      transform: scale(1.1);
      box-shadow: 0 0 15px #ffeb3b;
      z-index: 2;
    }

    .reset-btn {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s ease;
    }

    .reset-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Candy Match</h1>
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Moves: <span id="moves">20</span></div>
    </div>
  </div>

  <div id="board" class="board"></div>

  <button class="reset-btn" onclick="resetGame()">New Game</button>

  <script>
    const width = 8;
    const board = document.getElementById('board');
    const scoreDisplay = document.getElementById('score');
    const movesDisplay = document.getElementById('moves');

    const candies = ['🍬', '🍭', '🍩', '🍫', '🍇'];
    let grid = [];
    let selectedTile = null;
    let score = 0;
    let moves = 20;
    let isProcessing = false;

    function createBoard() {
      grid = [];
      board.innerHTML = '';
      for (let i = 0; i < width * width; i++) {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.setAttribute('data-id', i);
        
        let randomCandy;
        do {
          randomCandy = candies[Math.floor(Math.random() * candies.length)];
        } while (
          (i >= 2 && grid[i - 1] === randomCandy && grid[i - 2] === randomCandy) ||
          (i >= width * 2 && grid[i - width] === randomCandy && grid[i - width * 2] === randomCandy)
        );

        grid.push(randomCandy);
        tile.textContent = randomCandy;
        tile.addEventListener('click', handleTileClick);
        board.appendChild(tile);
      }
    }

    function handleTileClick() {
      if (isProcessing || moves <= 0) return;

      const index = parseInt(this.getAttribute('data-id'));

      if (!selectedTile) {
        selectedTile = this;
        this.classList.add('selected');
        return;
      }

      const firstIndex = parseInt(selectedTile.getAttribute('data-id'));
      const secondIndex = index;

      selectedTile.classList.remove('selected');
      const isAdjacent = checkAdjacency(firstIndex, secondIndex);

      if (isAdjacent) {
        swapCandies(firstIndex, secondIndex);
        moves--;
        movesDisplay.textContent = moves;

        if (!checkAndClearMatches()) {
          setTimeout(() => {
            swapCandies(firstIndex, secondIndex);
          }, 300);
        } else {
          processMatches();
        }
      }
      selectedTile = null;
    }

    function checkAdjacency(id1, id2) {
      const validMoves = [id1 - 1, id1 + 1, id1 - width, id1 + width];
      const isSameRow = Math.floor(id1 / width) === Math.floor(id2 / width);
      
      if (Math.abs(id1 - id2) === 1 && !isSameRow) return false;
      return validMoves.includes(id2);
    }

    function swapCandies(id1, id2) {
      const temp = grid[id1];
      grid[id1] = grid[id2];
      grid[id2] = temp;
      updateBoardUI();
    }

    function updateBoardUI() {
      const tiles = board.children;
      for (let i = 0; i < grid.length; i++) {
        tiles[i].textContent = grid[i] || '';
      }
    }

    function checkAndClearMatches() {
      let matchedIndices = new Set();

      // Horizontal check
      for (let r = 0; r < width; r++) {
        for (let c = 0; c < width - 2; c++) {
          let idx = r * width + c;
          let candy = grid[idx];
          if (candy && candy === grid[idx + 1] && candy === grid[idx + 2]) {
            matchedIndices.add(idx);
            matchedIndices.add(idx + 1);
            matchedIndices.add(idx + 2);
          }
        }
      }

      // Vertical check
      for (let c = 0; c < width; c++) {
        for (let r = 0; r < width - 2; r++) {
          let idx = r * width + c;
          let candy = grid[idx];
          if (candy && candy === grid[idx + width] && candy === grid[idx + width * 2]) {
            matchedIndices.add(idx);
            matchedIndices.add(idx + width);
            matchedIndices.add(idx + width * 2);
          }
        }
      }

      if (matchedIndices.size > 0) {
        score += matchedIndices.size * 10;
        scoreDisplay.textContent = score;
        matchedIndices.forEach(idx => { grid[idx] = null; });
        updateBoardUI();
        return true;
      }
      return false;
    }

    function applyGravity() {
      for (let c = 0; c < width; c++) {
        let emptySpot = width - 1;
        for (let r = width - 1; r >= 0; r--) {
          let idx = r * width + c;
          if (grid[idx] !== null) {
            let targetIdx = emptySpot * width + c;
            grid[targetIdx] = grid[idx];
            if (emptySpot !== r) grid[idx] = null;
            emptySpot--;
          }
        }
        for (let r = emptySpot; r >= 0; r--) {
          let idx = r * width + c;
          grid[idx] = candies[Math.floor(Math.random() * candies.length)];
        }
      }
      updateBoardUI();
    }

    async function processMatches() {
      isProcessing = true;
      while (checkAndClearMatches()) {
        await new Promise(res => setTimeout(res, 250));
        applyGravity();
        await new Promise(res => setTimeout(res, 250));
      }
      isProcessing = false;
    }

    function resetGame() {
      score = 0;
      moves = 20;
      scoreDisplay.textContent = score;
      movesDisplay.textContent = moves;
      createBoard();
    }

    createBoard();
  </script>
</body>
</html>
